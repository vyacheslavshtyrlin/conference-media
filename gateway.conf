# Media edge: TLS-терминация для signaling WebSocket (браузер ходит напрямую на media).
# envsubst подставляет ${MEDIA_DOMAIN}. Сертификат: Let's Encrypt (certbot, webroot).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Do not log query parameters because WebSocket URLs carry short-lived tokens.
log_format token_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_user_agent" request_time=$request_time';

# HTTP: проверка ACME (HTTP-01) + редирект на HTTPS
server {
    listen 80;
    server_name ${MEDIA_DOMAIN};
    access_log /var/log/nginx/access.log token_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: signaling WebSocket + health
server {
    listen 443 ssl;
    http2 on;
    server_name ${MEDIA_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${MEDIA_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MEDIA_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location = /health {
        set $backend signaling:4000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        set $backend signaling:4000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Signaling WebSocket > контейнер signaling:4000
    location /ws {
        set $backend signaling:4000;
        proxy_pass http://$backend;
        access_log /var/log/nginx/access.log token_safe;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Private WebSocket for recording capture workers.
    location /internal/recording-bot/v1 {
        set $backend signaling:4000;
        proxy_pass http://$backend;
        access_log /var/log/nginx/access.log token_safe;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
