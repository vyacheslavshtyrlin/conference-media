stages:
  - validate
  - image

variables:
  DOCKER_TLS_CERTDIR: "/certs"

validate:
  stage: validate
  image: node:22-alpine
  before_script:
    - apk add --no-cache python3 make g++ linux-headers
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build

build-image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --target production -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
