stages:
  - validate
  - build
  - deploy
  - cleanup

variables:
  DEPLOY_BRANCH: "main"
  IMAGE_ENV_VAR: "MEDIA_IMAGE"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - 158.160.10.26

validate:
  stage: validate
  allow_failure: true
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  script:
    - docker build -f Dockerfile --target production -t "conference-${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}" -t "conference-${CI_PROJECT_NAME}:latest" .
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

deploy:
  stage: deploy
  environment:
    name: prod
    url: $PROD_URL
  script:
    - |
      if [ -n "$DEPLOY_ENV_PROD" ] && [ -f "$DEPLOY_ENV_PROD" ]; then
        cp -f "$DEPLOY_ENV_PROD" .env
      else
        cp -f .env.example .env
      fi
    - export ${IMAGE_ENV_VAR}="conference-${CI_PROJECT_NAME}:latest"
    - docker compose -f docker-compose.yml up -d --no-build --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

cleanup:
  stage: cleanup
  script:
    - docker container prune --force --filter "until=24h"
    - docker image prune --force --filter "until=24h"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: always
