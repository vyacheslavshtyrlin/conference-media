name: conference-media

services:
  signaling:
    image: ${MEDIA_IMAGE:-conference-media:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${SIGNALING_BIND_ADDR:-127.0.0.1}:${SIGNALING_PORT:-4000}:4000"
      - "${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}/udp"
      - "${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}/tcp"
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: ${MEDIA_REDIS_URL:-redis://redis:6379}
      JOIN_TOKEN_SECRET: ${JOIN_TOKEN_SECRET:?JOIN_TOKEN_SECRET is required}
      ROOM_EMPTY_GRACE_MS: ${ROOM_EMPTY_GRACE_MS:-10000}
      WS_HEARTBEAT_INTERVAL_MS: ${WS_HEARTBEAT_INTERVAL_MS:-30000}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-65536}
      WS_SEND_BACKPRESSURE_BYTES: ${WS_SEND_BACKPRESSURE_BYTES:-262144}
      WS_RATE_LIMIT_WINDOW_MS: ${WS_RATE_LIMIT_WINDOW_MS:-10000}
      WS_RATE_LIMIT_MAX_MESSAGES: ${WS_RATE_LIMIT_MAX_MESSAGES:-60}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?WS_ALLOWED_ORIGINS is required}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?MEDIASOUP_ANNOUNCED_IP is required}
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-40100}
      MEDIASOUP_NUM_WORKERS: ${MEDIASOUP_NUM_WORKERS:-2}
      MEDIASOUP_MAX_TRANSPORTS_PER_PEER: ${MEDIASOUP_MAX_TRANSPORTS_PER_PEER:-4}
      MEDIASOUP_MAX_PRODUCERS_PER_PEER: ${MEDIASOUP_MAX_PRODUCERS_PER_PEER:-3}
      MEDIASOUP_MAX_CONSUMERS_PER_PEER: ${MEDIASOUP_MAX_CONSUMERS_PER_PEER:-32}
      TURN_URLS: ${TURN_URLS:?TURN_URLS is required}
      TURN_USERNAME: ${TURN_USERNAME:?TURN_USERNAME is required}
      TURN_PASSWORD: ${TURN_PASSWORD:?TURN_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
      turn:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6-alpine
    volumes:
      - ./deploy/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --user=${TURN_USERNAME:?TURN_USERNAME is required}:${TURN_PASSWORD:?TURN_PASSWORD is required}
      - --realm=${TURN_REALM:?TURN_REALM is required}
    ports:
      - "${TURN_BIND_ADDR:-0.0.0.0}:3478:3478/udp"
      - "${TURN_BIND_ADDR:-0.0.0.0}:3478:3478/tcp"
      - "${TURN_MIN_PORT:-50000}-${TURN_MAX_PORT:-50100}:${TURN_MIN_PORT:-50000}-${TURN_MAX_PORT:-50100}/udp"
    restart: unless-stopped

volumes:
  redis-data:
